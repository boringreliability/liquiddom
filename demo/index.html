<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquid DOM — The Illusion</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      overflow: hidden;
    }

    h1 {
      font-size: 1.4rem;
      opacity: 0.6;
      font-weight: 300;
    }

    .elements {
      display: flex;
      gap: 30px;
      align-items: center;
    }

    /* The Illusion: DOM elements are transparent — Canvas paints behind them */
    [data-liquid] {
      background: transparent !important;
      border: none !important;
      position: relative;
      z-index: 1;
    }

    button.demo-btn {
      padding: 16px 32px;
      font-size: 1.1rem;
      color: #fff;
      cursor: pointer;
    }

    .card {
      width: 180px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      color: #e0e0ff;
    }

    /* Animated element — bounces left-right to prove tracking */
    .bouncer {
      padding: 16px 24px;
      color: #fff;
      font-size: 1rem;
      animation: bounce 2s ease-in-out infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateX(-80px); }
      to   { transform: translateX(80px); }
    }

    #liquid-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: -1;
    }

    .fps {
      position: fixed;
      top: 10px;
      right: 10px;
      font-size: 0.8rem;
      color: #0f0;
      font-family: monospace;
      z-index: 10000;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <h1>Liquid DOM — The Illusion</h1>

  <div class="elements">
    <button class="demo-btn" data-liquid>Button A</button>
    <div class="card" data-liquid>Static Card</div>
    <button class="demo-btn" data-liquid>Button B</button>
  </div>

  <div class="bouncer" data-liquid>Animated Element</div>

  <canvas id="liquid-canvas"></canvas>
  <div class="fps" id="fps">-- FPS</div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
