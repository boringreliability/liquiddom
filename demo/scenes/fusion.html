<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid DOM — Metaball Fusion</title>
  <style>
    :root {
      --bg: #0a0a12;
      --text: #f0e6ff;
      --muted: #7a6a9a;
      --accent: #e94560;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid #1a1a2a;
    }
    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    header p {
      color: var(--muted);
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }
    header a { color: var(--accent); text-decoration: none; }
    main {
      display: grid;
      grid-template-columns: auto auto;
      grid-template-rows: auto auto;
      gap: 30px;
      place-items: center;
      place-content: center;
      min-height: calc(100vh - 80px);
    }
    [data-liquid] {
      background: transparent !important;
      border: none !important;
      outline: none !important;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      cursor: default;
      width: 80px;
      height: 80px;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
    }
    #renderer-badge {
      display: inline-block;
      margin-left: 0.75rem;
      padding: 0.15rem 0.5rem;
      background: #1a1a2a;
      color: var(--muted);
      border-radius: 4px;
      font-size: 0.75rem;
      font-family: ui-monospace, monospace;
    }
    #renderer-badge[data-renderer="webgpu"] {
      background: rgba(56, 189, 248, 0.18);
      color: #7dd3fc;
    }
    .note {
      position: fixed;
      bottom: 1rem;
      left: 1rem;
      color: var(--muted);
      font-size: 0.8rem;
      max-width: 32rem;
      line-height: 1.4;
    }
    .note code { font-family: ui-monospace, monospace; color: #7dd3fc; }
  </style>
</head>
<body>
  <header>
    <h1>Liquid DOM — Metaball Fusion</h1>
    <p>
      Four nearby blobs visibly merge via smooth-min SDF blending.
      <a href="../index.html">← back to demos</a>
      <span id="renderer-badge">renderer: …</span>
    </p>
  </header>

  <main>
    <div data-liquid>A</div>
    <div data-liquid>B</div>
    <div data-liquid>C</div>
    <div data-liquid>D</div>
  </main>

  <p class="note">
    Try <code>?renderer=canvas2d</code> to see the un-fused (per-element) version.
    Try <code>?fusionRadius=120</code> to override the radius via URL. Fusion is WebGPU-only.
  </p>

  <script type="module" src="./fusion.ts"></script>
</body>
</html>
