<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>liquiddom: acceptance scene</title>
    <style>
      :root {
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        background: #f3efe6;
        color: #1d1d1f;
        /* System stack: no external fonts under COEP require-corp (skeleton §1.9). */
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      /* Spec §6 layout at 1280×800: buttons 140×48 r24 at y 260, card 320×180 r16 at y 340. */
      .stage {
        box-sizing: border-box;
        width: 1280px;
        margin: 0 auto;
        padding-top: 260px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .buttons {
        display: flex;
        gap: 24px;
      }
      .btn {
        box-sizing: border-box;
        width: 140px;
        height: 48px;
        padding: 0;
        border: 0;
        border-radius: 24px;
        color: #ffffff;
        font-family: inherit;
        font-size: 16px;
        font-weight: 600;
        line-height: 48px;
        cursor: pointer;
      }
      .btn--splash {
        background: #2f6fde;
      }
      .btn--split {
        background: #ca4b20; /* W66: darkened from #e0663d to pass WCAG AA (4.63:1) with white text */
      }
      .btn--merge {
        background: #1a8361; /* W66: darkened from #1f9d74 to pass WCAG AA (4.71:1) with white text */
      }
      .btn:focus-visible {
        outline: 3px solid #1d1d1f;
        outline-offset: 3px;
      }
      .card {
        box-sizing: border-box;
        width: 320px;
        height: 180px;
        margin-top: 32px;
        padding: 24px 28px;
        border-radius: 16px;
        background: #263238;
        color: #f5f5f5;
      }
      .card h2 {
        margin: 0 0 12px;
        font-size: 22px;
        line-height: 28px;
      }
      .card p {
        margin: 0;
        font-size: 16px;
        line-height: 24px;
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <div class="buttons">
        <button id="splash" class="btn btn--splash" type="button" data-liquid>Splash</button>
        <button id="split" class="btn btn--split" type="button" data-liquid>Split</button>
        <button id="merge" class="btn btn--merge" type="button" data-liquid>Merge</button>
      </div>
      <article id="card" class="card" data-liquid>
        <h2>Liquid at rest</h2>
        <p>The DOM stays the source of truth.</p>
        <p>The liquid only follows it.</p>
      </article>
    </main>
    <script type="module" src="./acceptance.ts"></script>
  </body>
</html>
