<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>liquiddom: Material Playground</title>
  <style>
    :root {
      --bg: #0a0a12;
      --text: #f0e6ff;
      --muted: #8a7aaa;
      --accent: #e94560;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    header { padding: 1.5rem 2rem; border-bottom: 1px solid #1a1a2a; }
    header h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.01em; }
    header p { color: var(--muted); font-size: 0.875rem; margin-top: 0.25rem; }
    header a { color: var(--accent); text-decoration: none; }
    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 4rem;
      padding: 6rem 22rem 6rem 4rem;
      place-items: center;
      min-height: calc(100vh - 80px);
    }
    @media (max-width: 1100px) {
      main { padding: 4rem 2rem; }
    }
    @media (max-width: 720px) {
      main { grid-template-columns: 1fr; grid-template-rows: repeat(4, auto); padding: 3rem 1.5rem 55vh; gap: 2.5rem; }
    }
    /* Liquid colour comes from each element's computed background (spec §3 Colour).
       Never force `background: transparent` here: the injected stylesheet does that
       after the colour snapshot. Uniform circular radii only (v1). */
    .shape {
      color: #fff;
      font: inherit;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .pill { width: 200px; height: 60px; border-radius: 30px; background: #e94560; border: 0; cursor: pointer; }
    .pill:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    .circle { width: 120px; height: 120px; border-radius: 60px; background: #38bdf8; color: #04202e; }
    .rect { width: 160px; height: 80px; border-radius: 0; background: #a78bfa; color: #1e1037; }
    .rounded { width: 220px; height: 140px; border-radius: 16px; background: #0f3460; flex-direction: column; gap: 0.25rem; }
    .rounded small { font-weight: 400; opacity: 0.8; }
    #tweak-mount {
      position: fixed;
      top: 1rem;
      right: 1rem;
      width: 300px;
      max-height: calc(100vh - 2rem);
      overflow-y: auto;
      z-index: 100;
    }
    @media (max-width: 720px) {
      #tweak-mount {
        right: 0; left: 0; bottom: 0; top: auto;
        width: 100%;
        max-height: 50vh;
        border-top: 1px solid #1a1a2a;
        background: var(--bg);
      }
      #tweak-mount[data-collapsed="true"] { max-height: 3rem; overflow: hidden; }
    }
    #pane-toggle {
      display: none;
      position: fixed;
      top: 1rem; right: 1rem;
      z-index: 101;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      font-size: 0.875rem;
    }
    @media (max-width: 720px) { #pane-toggle { display: block; } }
    #toast {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: var(--accent);
      color: #fff;
      padding: 0.75rem 1.5rem;
      border-radius: 4px;
      font-size: 0.875rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms ease;
      z-index: 200;
    }
    #toast[data-visible="true"] { opacity: 1; }
    #renderer-badge {
      display: inline-block;
      margin-left: 0.75rem;
      padding: 0.15rem 0.5rem;
      background: #1a1a2a;
      color: var(--muted);
      border-radius: 4px;
      font-size: 0.75rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
  </style>
</head>
<body>
  <header>
    <h1>liquiddom: Material Playground</h1>
    <p>
      Tune viscosity, cohesion and recovery live. Click a shape to splash it; Tab + Enter splashes the pill at its centre.
      <a href="../index.html">← back to scenes</a>
      <span id="renderer-badge">renderer: …</span>
    </p>
  </header>

  <main>
    <button class="shape pill" data-liquid>Pill button</button>
    <div class="shape circle" data-liquid>Circle</div>
    <div class="shape rect" data-liquid>Rectangle</div>
    <div class="shape rounded" data-liquid>Rounded card<small>a heading-sized block</small></div>
  </main>

  <button id="pane-toggle" aria-label="Toggle controls">Controls</button>
  <div id="tweak-mount"></div>
  <div id="toast" role="status"></div>

  <script type="module" src="./playground.ts"></script>
</body>
</html>
