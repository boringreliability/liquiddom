<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>liquiddom: tilt</title>
    <style>
      /* W83 (D83-1 … D83-5): the acceptance layout (three 140×48 r24 pills at y 260, a 320×180 r16
         card at y 340 at 1280×800; it wraps on a phone) and a gravity control at the bottom. */
      :root {
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        background: #f3efe6;
        color: #1d1d1f;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .stage {
        box-sizing: border-box;
        width: 100%;
        max-width: 1280px;
        margin: 0 auto;
        padding-top: 260px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .buttons {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 24px;
      }
      .btn {
        box-sizing: border-box;
        width: 140px;
        height: 48px;
        padding: 0;
        border: 0;
        border-radius: 24px;
        color: #ffffff;
        font-family: inherit;
        font-size: 16px;
        font-weight: 600;
        line-height: 48px;
      }
      .btn--a {
        background: #2f6fde;
      }
      .btn--b {
        background: #ca4b20;
      }
      .btn--c {
        background: #1a8361;
      }
      .card {
        box-sizing: border-box;
        width: 320px;
        height: 180px;
        margin-top: 32px;
        padding: 24px 28px;
        border-radius: 16px;
        background: #263238;
        color: #f5f5f5;
      }
      .card h2 {
        margin: 0 0 12px;
        font-size: 22px;
        line-height: 28px;
      }
      .card p {
        margin: 0;
        font-size: 16px;
        line-height: 24px;
      }
      .controls {
        position: fixed;
        left: 16px;
        bottom: 16px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        font-size: 14px;
      }
      .controls input[type="range"] {
        width: 220px;
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <div class="buttons">
        <button class="btn btn--a" type="button" data-liquid>Tilt</button>
        <button class="btn btn--b" type="button" data-liquid>Slosh</button>
        <button class="btn btn--c" type="button" data-liquid>Rest</button>
      </div>
      <article class="card" data-liquid>
        <h2>Tilt the page</h2>
        <p>Only a change in gravity moves the liquid.</p>
        <p>It sloshes, then rests at home.</p>
      </article>
    </main>
    <div class="controls">
      <label for="angle">Gravity</label>
      <input id="angle" type="range" min="-180" max="180" step="1" value="0" />
      <output id="angle-out" for="angle">0°</output>
      <button id="device-tilt" type="button">Use device tilt</button>
      <span id="status" role="status"></span>
    </div>
    <script type="module" src="./tilt.ts"></script>
  </body>
</html>
