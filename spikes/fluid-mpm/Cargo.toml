[package]
name = "fluid-mpm"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone: NOT part of the root liquiddom crate or any workspace.
[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
