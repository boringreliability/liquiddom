name: Release

# Publishes the fixed group (liquiddom, @liquiddom/react, @liquiddom/vue) with npm
# trusted publishing (OIDC): no token. Each package has a trusted publisher on
# npmjs.com for boringreliability/liquiddom, workflow `release.yml`, no environment.
# Provenance is generated automatically (public repo, public packages).
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish to npm via changeset
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      # Node 24: Astro 7 (the site, built by `npm run build`) needs >= 22.23.4.
      # No package-manager cache in a release build (npm's trusted-publishing guidance);
      # setup-node v4 caches only when `cache` is set.
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; `changeset publish` uses the npm on PATH.
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      - name: Show npm version
        run: npm --version

      - name: Install npm deps
        run: npm ci

      - name: Build (wasm + all packages)
        run: npm run build

      # No NODE_AUTH_TOKEN: npm authenticates with the workflow's OIDC token.
      - name: Publish via changesets
        run: npx changeset publish
