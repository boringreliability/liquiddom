name: Deploy site

# W66 (spec §5): the site is FROZEN during the fluid-engine rewrite. It still
# imports the retired soft-body API, so it is out of the root workspaces and
# out of CI; the live site stays on the `softbody-final` deployment. It is
# rebuilt as a fluid playground and re-enabled in slice 6.
# Do NOT dispatch this workflow before then: the build would fail.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Build wasm and all packages
        run: npm run build

      - name: Build site workspace @liquiddom/site
        run: npm run build -w @liquiddom/site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
