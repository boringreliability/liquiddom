<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>liquiddom/react — minimal example</title>
  <style>
    :root {
      --bg: #0a0a12;
      --text: #f0e6ff;
      --muted: #7a6a9a;
      --accent: #e94560;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      padding: 2rem;
    }
    h1 { font-size: 1.5rem; font-weight: 600; }
    p { color: var(--muted); font-size: 0.9rem; }
    .pill {
      background: transparent !important;
      border: none !important;
      outline: none !important;
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      width: 220px;
      height: 60px;
      border-radius: 50%;
      cursor: default;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
